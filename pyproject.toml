[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "enterprise-genai-agent-platform"
version = "0.1.0"
description = "A secure, local-first enterprise GenAI agent platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp>=3.10,<4",
  "azure-ai-contentsafety>=1.0.0,<2",
  "azure-identity>=1.19,<2",
  "azure-search-documents>=11.6.0,<13",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "fastapi>=0.116,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.29,<2",
  "msgpack>=1.2.1,<2",
  "openai>=1.54,<2",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
  "pg8000>=1.31,<2",
  # presidio-anonymizer is intentionally NOT a dependency: it unconditionally
  # pins cryptography<49, which carries known CVEs. Detection-only via
  # presidio-analyzer is sufficient; masking is a simple span substitution
  # implemented in safety/pii.py.
  "presidio-analyzer>=2.2.360,<3",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "PyYAML>=6.0.3,<7",
  "redis>=6.4,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2",
  "detect-secrets>=1.5,<2",
  "mypy>=1.15,<3",
  "pip-audit>=2.8,<3",
  "pip-licenses>=5.0,<6",
  "pre-commit>=4.1,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
  "uv>=0.12,<1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_genai_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# All subprocess calls here invoke `docker` with hardcoded, trusted argument
# lists (no user or network-derived input) to manage a throwaway test
# container; S603/S607 exist to catch untrusted input and PATH-hijack risk,
# neither of which applies to fixed local test infrastructure.
"tests/integration/test_postgres_rls_pool.py" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = "(^|/)([.]venv|build|dist)/"

[tool.pytest.ini_options]
addopts = """--strict-config --strict-markers --cov --cov-report=term-missing \
--cov-fail-under=80 -m "not live_azure and not live_postgres\""""
testpaths = ["tests"]
markers = [
    "live_azure: calls a real Azure endpoint; excluded by default, run via `make live-verification`",
    "live_postgres: starts a real Postgres container via docker; excluded by default, run via `make live-verification-postgres`",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = []

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
