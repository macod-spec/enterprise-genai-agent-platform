name: payment-investigation
version: 1.0.0
description: Investigate synthetic payment status without executing a financial action.
owner: {team: payments-platform, contact: payments-platform@novabank.example}
agent: payments
model: {provider: mock, model: deterministic-router-v1, max_input_tokens: 2000, max_output_tokens: 500}
