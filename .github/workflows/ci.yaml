name: Local-equivalent CI and security gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: python -m pip install 'uv==0.12.3'
      - run: UV_CACHE_DIR=.security-reports/uv-cache uv sync --frozen --extra dev
      - run: UV_CACHE_DIR=.security-reports/uv-cache .venv/bin/uv lock --check
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/mypy src tests
      - run: .venv/bin/pytest
      - run: .venv/bin/bandit -q -r src agents mcp platform rag -c pyproject.toml
      - run: .venv/bin/pip-audit
      - run: .venv/bin/python -m enterprise_genai_platform.evaluation.runner
      - run: .venv/bin/python scripts/load-failure-test.py
      - run: .venv/bin/python scripts/operator-demo.py
      - run: .venv/bin/python scripts/operational-readiness.py
      - run: .venv/bin/python scripts/portfolio-evidence.py
      - run: >-
          .venv/bin/pip-licenses --with-system --format=json
          --allow-only='3-Clause BSD License;Apache Software License;Apache Software License; MIT License;Apache-2.0;Apache-2.0 AND BSD-2-Clause;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;Apache-2.0 OR MIT;BSD License;BSD-2-Clause;BSD-3-Clause;MIT;MIT License;MIT OR Apache-2.0;MIT-0;MIT No Attribution License (MIT-0);MPL-2.0 AND (Apache-2.0 OR MIT);Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python Software Foundation License'

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: semgrep scan --config .semgrep.yml --error --metrics off

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: gitleaks/gitleaks-action@v2

  infrastructure-static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  terraform-zero-resource-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.15.6", terraform_wrapper: false}
      - run: make terraform-zero-plan
      - run: python scripts/preproduction-readiness.py

  container-build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: enterprise-agent-platform:ci
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: enterprise-agent-platform:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  local-kubernetes-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
        with: {version: v3.18.4}
      - run: go install sigs.k8s.io/kind@v0.32.0
      - run: make kind-integration

  durable-state-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: python -m pip install 'uv==0.12.3'
      - run: UV_CACHE_DIR=.security-reports/uv-cache uv sync --frozen --extra dev
      - run: make durable-state-integration

# Intentionally absent: cloud login, registry push, non-zero plan, terraform apply,
# remote kubectl, and deployment. The Terraform job asserts a zero-resource plan.
