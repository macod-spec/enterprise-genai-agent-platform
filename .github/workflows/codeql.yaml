name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@v3
        with: {languages: python}
      - uses: github/codeql-action/analyze@v3
