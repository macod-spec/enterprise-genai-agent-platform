name: Live Azure adapter verification (real calls, real small cost)

# Complements ci.yaml, which never calls a real Azure endpoint. This workflow
# runs the tests/integration suite (pytest -m live_azure) against the real
# Azure OpenAI, Azure AI Search and Azure Content Safety resources, proving
# the keyless adapters actually work — not just that they type-check and pass
# against a mocked SDK client. workflow_dispatch only: it spends real (if
# small) money and depends on live resources that may not always exist.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: python -m pip install 'uv==0.12.3'
      - run: uv sync --frozen --extra dev
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Live Azure OpenAI / AI Search / Content Safety verification
        env:
          LIVE_AZURE_OPENAI_ENDPOINT: ${{ vars.LIVE_AZURE_OPENAI_ENDPOINT }}
          LIVE_AZURE_OPENAI_DEPLOYMENT: ${{ vars.LIVE_AZURE_OPENAI_DEPLOYMENT }}
          LIVE_AZURE_SEARCH_ENDPOINT: ${{ vars.LIVE_AZURE_SEARCH_ENDPOINT }}
          LIVE_CONTENT_SAFETY_ENDPOINT: ${{ vars.LIVE_CONTENT_SAFETY_ENDPOINT }}
        run: .venv/bin/python -m pytest tests/integration -m live_azure -v --no-cov
